x-zenith:
  catalog:
    name: echochamber
    description: Private rooms for sharing links and talking about them in threaded comments.
    authors: [Neel Sharma]
    source: https://github.com/neelkarma/echochamber
    license: MIT
    tags: [links, chat, sveltekit]
  sign_in:
    redirect_paths: [/api/auth/callback/oidc]
  expose:
    - { service: web, port: 3000, web: true }
  storage:
    data:
      volume: data
      label: Database
      description: SQLite database with accounts, rooms, links and comments.
  env:
    BETTER_AUTH_SECRET:
      generate: "([A-Za-z0-9_-]{32})([A-Za-z0-9_-]{16})"
      services: [web]
    BETTER_AUTH_URL:
      alias: ZENITH_PUBLIC_URL
      services: [web]
    OIDC_ISSUER:
      alias: ZENITH_OIDC_ISSUER
      services: [web]
    OIDC_CLIENT_ID:
      alias: ZENITH_OIDC_CLIENT_ID
      services: [web]
    OIDC_CLIENT_SECRET:
      alias: ZENITH_OIDC_CLIENT_SECRET
      services: [web]
    GITHUB_CLIENT_ID:
      services: [web]
      input:
        label: GitHub OAuth client ID
        description: Optional. Set with the secret to enable "Continue with GitHub". Callback URL is <app URL>/api/auth/callback/github.
        required: false
    GITHUB_CLIENT_SECRET:
      services: [web]
      input:
        label: GitHub OAuth client secret
        required: false
        secret: true
    GOOGLE_CLIENT_ID:
      services: [web]
      input:
        label: Google OAuth client ID
        description: Optional. Set with the secret to enable "Continue with Google". Callback URL is <app URL>/api/auth/callback/google.
        required: false
    GOOGLE_CLIENT_SECRET:
      services: [web]
      input:
        label: Google OAuth client secret
        required: false
        secret: true

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /data/echochamber.db
      OIDC_PROVIDER_NAME: Zenith
    volumes:
      - data:/data

volumes:
  data:
